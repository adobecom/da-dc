<!-- MWPW-214935 reproduction only, do not merge: prelink manifest for /drafts/ilyas/acrobat/plans (adobecom/perf-tools prelink/head.html) -->
<link rel="preload" href="/drafts/ilyas/acrobat/preloads/plans.json" as="fetch" crossorigin="anonymous">
<script>
  // Prelink manifest loader (adobecom/perf-tools prelink/head.html). The page <dir>/<name> has its preload links in
  // <dir>/preloads/<name>.json (a DA sheet: rel, href, as, crossorigin, fetchpriority). The <link rel="preload"
  // as="fetch" crossorigin="anonymous"> above prelinks it, so this fetch() reuses that download.
  // Valid rows become link elements in the head; a missing or invalid manifest, or any error, leaves the page unchanged.
  (() => {
    try {
      const { origin, hostname, pathname } = window.location;
      const page = pathname.replace(/\.html$/, '');
      const slash = page.lastIndexOf('/');
      const manifest = `${page.slice(0, slash + 1)}preloads/${page.slice(slash + 1) || 'index'}.json`;
      const AS = ['script', 'style', 'font', 'image', 'fetch'];
      const PRIORITY = ['high', 'low', 'auto'];
      const allowedHost = (h) => h === hostname || /^[a-z0-9-]+--[a-z0-9-]+--adobecom\.aem\.live$/.test(h)
        || h.endsWith('.adobe.com') || h === 'use.typekit.net' || h === 'p.typekit.net';
      fetch(manifest).then((res) => (res.ok ? res.json() : null)).then((sheet) => {
        const rows = sheet && sheet[':type'] === 'sheet' && Array.isArray(sheet.data) ? sheet.data : [];
        const present = new Set([...document.querySelectorAll('link[href]')].map((l) => l.href));
        rows.forEach((row) => {
          const rel = row && String(row.rel);
          if (rel !== 'preload' && rel !== 'modulepreload') return;
          let url;
          try { url = new URL(String(row.href), origin); } catch (e) { return; }
          if (url.protocol !== 'https:' || !allowedHost(url.hostname) || present.has(url.href)) return;
          if (rel === 'preload' && !AS.includes(row.as)) return;
          const link = document.createElement('link');
          link.rel = rel;
          if (rel === 'preload') link.as = row.as;
          if (row.crossorigin === 'anonymous') link.crossOrigin = 'anonymous';
          if (PRIORITY.includes(row.fetchpriority)) link.setAttribute('fetchpriority', row.fetchpriority);
          // Stylesheet preloads use //host/path: site loaders skip a stylesheet when any link[href="<its URL>"]
          // exists, whether they load it by path or by absolute URL; this form never equals either string.
          link.setAttribute('href', row.as === 'style' ? `//${url.host}${url.pathname}${url.search}` : url.href);
          present.add(url.href);
          document.head.append(link);
        });
      }).catch(() => {});
    } catch (e) { /* never break the page */ }
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="head-loaded" content="false" />
<link rel="preconnect" href="https://acrobat.adobe.com" crossorigin>
<script src="/acrobat/scripts/scripts.js" type="module"></script>
<style>body { display: none; }</style>
<link rel="icon" href="data:,">
<script nomodule src="/acrobat/scripts/fallback.js"></script>
<script>
  window.setLibs = (prodLibs, location = window.location) => {
    const { hostname, search } = location;
    if (!['.aem.', '.hlx.', '.stage.', 'local', '.da.'].some((i) => hostname.includes(i))) return prodLibs;
    const branch = new URLSearchParams(search).get('milolibs') || 'main';
    if (!/^[a-zA-Z0-9_-]+$/.test(branch)) throw new Error('Invalid branch name.');
    if (branch === 'main' && hostname === 'www.stage.adobe.com') return '/libs';
    if (branch === 'local') return 'http://localhost:6456/libs';
    const env = hostname.includes('.hlx.') ? 'hlx' : 'aem';
    return `https://${branch}${branch.includes('--') ? '' : '--milo--adobecom'}.${env}.live/libs`;
  };

  window.getUnityLibs = (prodLibs = '/unitylibs') => {
    const { hostname, search } = window.location;
    if (!['.aem.', '.hlx.', '.stage.', 'local', '.da.'].some((i) => hostname.includes(i))) return prodLibs;
    const branch = new URLSearchParams(search).get('unitylibs') || 'main';
    if (!/^[a-zA-Z0-9_-]+$/.test(branch)) throw new Error('Invalid branch name.');
    if (branch === 'main' && hostname === 'www.stage.adobe.com') return prodLibs;
    const env = hostname.includes('.hlx.') ? 'hlx' : 'aem';
    return `https://${branch}${branch.includes('--')? '' : '--unity--adobecom'}.${env}.live/unitylibs`;
  }

  window.extractLocalePrefix = (pathname = window.location.pathname) => {
    const segments = pathname.split('/').filter(Boolean);
    if (!segments[0] || segments[0] === 'acrobat') {
      return '';
    }
    return `/${segments[0]}`;
  }

  window.loadLink = (href, options = {}) => {
    const { as, callback, crossorigin, rel, fetchpriority } = options;
    let link = document.head.querySelector(`link[href="${href}"]`);
    if (!link) {
      link = document.createElement('link');
      link.setAttribute('rel', rel);
      if (as) link.setAttribute('as', as);
      if (crossorigin) link.setAttribute('crossorigin', crossorigin);
      if (fetchpriority) link.setAttribute('fetchpriority', fetchpriority);
      link.setAttribute('href', href);
      if (callback) {
        link.onload = (e) => callback(e.type);
        link.onerror = (e) => callback(e.type);
      }
      document.head.appendChild(link);
    } else if (callback) {
      callback('noop');
    }
    return link;
  }

  const miloLibs = setLibs('/libs');
  const unityLibs = getUnityLibs();
  const localePrefix =  extractLocalePrefix();


  const preloads = document.querySelector('meta[name="preloads"]')?.content?.split(',').map(x => x.trim().replace('$MILOLIBS', miloLibs).replace('$UNITYLIBS', unityLibs).replace('$LOCALEPREFIX', localePrefix)) || [];
  preloads.forEach((link) => {
    if (link.endsWith('.js')) {
      loadLink(link, { as: 'script', rel: 'preload', crossorigin: 'anonymous' });
    } else if (link.endsWith('.css')) {
      loadLink(link, { as: 'style', rel: 'preload' });
    } else if (/\.(json|html|svg)$/.test(link)) {
      loadLink(link, { as: 'fetch', rel: 'preload', crossorigin: 'anonymous' });
    } else if (/\.(png|jpg|jpeg|gif|webp)$/.test(link)) {
      loadLink(link, { as: 'image', rel: 'preload', fetchpriority: 'high' });
    }
  });

  const userAgentMeta = document.querySelector('meta[name="hreflinksuseragents"]');
  const allowedAgents = userAgentMeta && userAgentMeta.content.split(',');
  const userAgentString = window.navigator.userAgent;
  const isAllowedAgent = allowedAgents && allowedAgents.some((agent) => userAgentString.includes(agent.trim()));

  const flagMeta = document.querySelector('meta[name="head-loaded"]');
  const headAlreadyLoaded = flagMeta.content === 'true';
  const LOCALES = ['ae_ar', 'ae_en', 'africa', 'ar', 'at', 'au', 'be_en', 'be_fr', 'be_nl', 'bg', 'br', 'ca_fr', 'ca', 'ch_de', 'ch_fr', 'ch_it', 'cl', 'cn', 'co', 'cr', 'cy_en', 'cz', 'de', 'dk', 'ec', 'ee', 'eg_ar', 'eg_en', 'el', 'es', 'fi', 'fr', 'gr_el', 'gr_en', 'gt', 'hk_en', 'hk_zh', 'hu', 'id_en', 'id_id', 'ie', 'il_en', 'il_he', 'in_hi', 'in', 'it', 'jp', 'kr', 'kw_ar', 'kw_en', 'la', 'lt', 'lu_de', 'lu_en', 'lu_fr', 'lv', 'mena_ar', 'mena_en', 'mt', 'mx', 'my_en', 'my_ms', 'ng', 'nl', 'no', 'nz', 'pe', 'ph_en', 'ph_fil', 'pl', 'pr', 'pt', 'qa_ar', 'qa_en', 'ro', 'ru', 'sa_ar', 'sa_en', 'se', 'sg', 'si', 'sk', 'th_en', 'th_th', 'tr', 'tw', 'ua', 'uk', 'vn_en', 'vn_vi', 'za'];

  (() => {
    function log(message, severity) {
      if (window.lana) window.lana.log(`hreflang: ${message}`, { tags: 'hreflang', severity });
      else console[severity === 'error' ? 'error' : 'warn'](`hreflang: ${message}`);
    }

    function buildLink(language, url) {
      const link = document.createElement('link');
      link.setAttribute('rel', 'alternate');
      link.setAttribute('hreflang', language);
      link.setAttribute('href', url);
      return link;
    }

    async function fetchAndParseSitemap() {
      const sitemapOrigin = 'https://www.adobe.com';
      const { origin, pathname } = window.location;

      let sitemapPath = '/dc-shared/assets/sitemap.xml';
      const localeMatch = LOCALES.find(locale => pathname.startsWith(`/${locale}/`));

      if (localeMatch) {
        sitemapPath = `/${localeMatch}/dc-shared/assets/sitemap.xml`;
      }
      
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 5000);
        let response;
        try {
          response = await fetch(`${origin}${sitemapPath}`, { signal: controller.signal });
        } finally {
          clearTimeout(timeoutId);
        }
        if (!response.ok) {
          log(`fetch failed (${response.status}) ${sitemapPath}`, 'error');
          return;
        }
        
        const xmlText = await response.text();
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
        const parseError = xmlDoc.querySelector('parsererror');
        if (parseError) {
          log(`parse failed ${sitemapPath}`, 'error');
          return;
        }
        
        const urlElements = xmlDoc.querySelectorAll('url');
        let currentUrlElement = null;
        let normalizedMatch = null;
        const normalizePath = (path) => path.replace(/\/$/, '').replace(/\.html$/, '');
        const isSitemapOrigin = (loc) => {
          try { return new URL(loc).origin === sitemapOrigin; } catch { return false; }
        };
        const targetPath = normalizePath(pathname);

        for (const urlElement of urlElements) {
          const loc = urlElement.querySelector('loc')?.textContent;
          if (!loc || !isSitemapOrigin(loc)) continue;
          const locPath = loc.slice(sitemapOrigin.length) || '/';
          if (!locPath.startsWith('/')) continue;
          if (locPath === pathname) {
            currentUrlElement = urlElement;
            break;
          }
          if (!normalizedMatch && normalizePath(locPath) === targetPath) {
            normalizedMatch = urlElement;
          }
        }
        currentUrlElement = currentUrlElement || normalizedMatch;
        
        if (!currentUrlElement) {
          log(`page not found in sitemap ${pathname}`, 'warning');
          return;
        }
        
        const alternateLinks = currentUrlElement.querySelectorAll('link[rel="alternate"]');
        const linkElements = [];

        alternateLinks.forEach(altLink => {
          const hreflang = altLink.getAttribute('hreflang');
          const href = altLink.getAttribute('href');
          
          if (hreflang && href) {
            linkElements.push(buildLink(hreflang, href));
          }
        });
        
        const titleElement = document.head.querySelector('title');
        if (linkElements.length > 0 && titleElement) {
          titleElement.after(...linkElements);
        }
      } catch (error) {
        log(`error fetching or parsing sitemap ${sitemapPath} - ${error.message}`, 'error');
      }
    } 

    if (isAllowedAgent && !headAlreadyLoaded) {
      fetchAndParseSitemap();
    }
  })();

  flagMeta.content = 'true';
</script>
